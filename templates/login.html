{% extends "base.html" %}

{% block title %}Sign In - SecureCorp{% endblock %}

{% block content %}
<div class="auth-card card">
    <h2>Account Login</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form action="/login" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. admin or john_doe" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="auth-hint">
        <small>Demo accounts: <code>admin</code> / <code>admin</code> or <code>john_doe</code> / <code>password</code></small>
    </div>
</div>
{% endblock %}
