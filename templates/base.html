<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise Portal{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SecureCorp Portal</div>
        <div class="nav-links">
            <a href="/">Home / Feed</a>
            <a href="/search">Directory</a>
            {% if session.get('user') %}
                <a href="/profile?id={{ session['user']['id'] }}">My Profile</a>
                <a href="/download?file=handbook.txt">Docs</a>
                <a href="/logout">Logout ({{ session['user']['username'] }})</a>
            {% else %}
                <a href="/login">Login</a>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
